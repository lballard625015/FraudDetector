services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraud_detection}
      POSTGRES_USER: ${POSTGRES_USER:-fraud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud_detection"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-service:
    build: ./api-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fraud_detection}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fraud}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  generator:
    build: ./generator
    profiles: ["full"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fraud}:${POSTGRES_PASSWORD:-change-me-local}@postgres:5432/${POSTGRES_DB:-fraud_detection}
    command: ["python", "generate.py", "--stream", "kafka", "--kafka-bootstrap", "kafka:9092"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  detection-engine:
    build: ./detection-engine
    command: ["./detection-engine", "--input", "kafka", "--output", "kafka", "--kafka-brokers", "kafka:9092", "--kafka-input-topic", "transactions", "--kafka-output-topic", "scored-events", "--kafka-group", "detection-engine"]
    ports:
      - "127.0.0.1:9101:9101"
    profiles: ["full"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  ml-service:
    build: ./ml-service
    environment:
      MODEL_ARTIFACT: /app/models/isolation_forest.joblib
    ports:
      - "127.0.0.1:8000:8000"
    profiles: ["full"]
    depends_on:
      - kafka

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["full"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api-service
      - detection-engine
      - ml-service

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["full"]
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  frontend:
    build: ./frontend
    profiles: ["full"]
    environment:
      VITE_API_TARGET: http://api-service:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api-service

  kafka:
    image: bitnamilegacy/kafka:3.7.0
    profiles: ["full"]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: bitnamilegacy/kafka:3.7.0
    profiles: ["full"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        kafka-topics.sh --create --if-not-exists --topic transactions --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1
        kafka-topics.sh --create --if-not-exists --topic scored-events --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1

volumes:
  postgres-data:
  grafana-data:
