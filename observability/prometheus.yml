global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-service:8080"]

  - job_name: detection-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["detection-engine:9101"]

  - job_name: ml-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-service:8000"]
